version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/Nexus"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuget-packages:
        patterns:
          - "*"

  - package-ecosystem: "nuget"
    directory: "/Nexus.Tests"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      nuget-test-packages:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
